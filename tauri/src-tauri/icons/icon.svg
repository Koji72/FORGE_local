<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Forge anvil shape -->
  <g fill="white">
    <!-- Anvil top -->
    <rect x="120" y="200" width="272" height="32" rx="4"/>

    <!-- Anvil body -->
    <path d="M140 232 L152 360 L360 360 L372 232 Z"/>

    <!-- Anvil base -->
    <rect x="130" y="360" width="252" height="24" rx="4"/>

    <!-- Hammer head -->
    <rect x="300" y="120" width="80" height="40" rx="6" transform="rotate(-30 340 140)"/>

    <!-- Hammer handle -->
    <rect x="350" y="140" width="12" height="100" rx="3" transform="rotate(-30 356 190)"/>
  </g>

  <!-- Spark effects -->
  <g fill="#FCD34D">
    <circle cx="200" cy="170" r="6"/>
    <circle cx="180" cy="150" r="4"/>
    <circle cx="220" cy="155" r="5"/>
    <circle cx="195" cy="140" r="3"/>
  </g>
</svg>
