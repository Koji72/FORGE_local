# Cargo configuration for Forge

[build]
# Use all available CPU cores
jobs = -1

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Cross-compilation for Linux ARM64
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[alias]
# Run all checks
check-all = "clippy --all-targets --all-features -- -D warnings"

# Run tests with coverage (requires cargo-tarpaulin)
cov = "tarpaulin --workspace --out Html"

# Audit dependencies
audit = "audit --deny warnings"

[env]
# Default log level for development
RUST_LOG = { value = "forge=debug", force = false }
